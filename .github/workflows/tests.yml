name: tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:

  xcode-project-test:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        # Check the Github runner images when updating this matrix: https://github.com/actions/runner-images/tree/main/images/macos
        flags: [
          "-scheme AppAuth-iOS -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.6' -sdk 'iphonesimulator'",
          "-scheme AppAuth-macOS -destination 'platform=macOS,arch=x86_64' -sdk 'macosx'",
          "-scheme AppAuth_macOS -destination 'platform=macOS,arch=x86_64' -sdk 'macosx'",
          "-scheme AppAuth-tvOS -destination 'platform=tvOS Simulator,name=Apple TV,OS=18.5' -sdk 'appletvsimulator'",
          "-scheme AppAuth_tvOS -destination 'platform=tvOS Simulator,name=Apple TV,OS=18.5' -sdk 'appletvsimulator'",
          "-scheme AppAuthTV -destination 'platform=tvOS Simulator,name=Apple TV,OS=18.5' -sdk 'appletvsimulator'"
        ]
    steps:
    - uses: actions/checkout@v5
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
    - name: Warm up simulator runtimes
      run: xcrun simctl list devices available
    - name: Run unit test targets
      run: |
        xcodebuild test \
          -project AppAuth.xcodeproj \
          ${{ matrix.flags }}

  pod-lib-lint:
    runs-on: macos-15
    strategy:
      matrix:
        flags: [
          '',
          '--use-libraries',
          '--use-static-frameworks'
        ]
    steps:
    - uses: actions/checkout@v5
    - name: Update Bundler
      run: bundle update --bundler
    - name: Install Ruby gems with Bundler
      run: bundle install
    - name: Lint podspec using local source
      run: pod lib lint --verbose ${{ matrix.flags }}

  spm-build-test:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v5
    - name: Build unit test target
      run: swift build
    - name: Run unit test target
      run: swift test --enable-code-coverage
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v6
      with: 
        version: v0.7.3

  xcode-27-preview-test:
    # Xcode 27 is currently only available on the preview `xcode-27` image,
    # on which Xcode 27 beta is the only (thus, default) Xcode and the simulator
    # runtimes are the 27.0 generation. The image is preview, so this job does
    # not block merges.
    # https://github.com/actions/runner-images/issues/14404
    runs-on: xcode-27
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: AppAuth-iOS
            sdk: iphonesimulator
            runtime: iOS-27-0
            device: iPhone 17
          - scheme: AppAuth-macOS
            sdk: macosx
          - scheme: AppAuth_macOS
            sdk: macosx
          - scheme: AppAuth-tvOS
            sdk: appletvsimulator
            runtime: tvOS-27-0
            device: Apple TV 4K (3rd generation)
          - scheme: AppAuth_tvOS
            sdk: appletvsimulator
            runtime: tvOS-27-0
            device: Apple TV 4K (3rd generation)
          - scheme: AppAuthTV
            sdk: appletvsimulator
            runtime: tvOS-27-0
            device: Apple TV 4K (3rd generation)
    steps:
    - uses: actions/checkout@v5
    - name: Warm up simulator runtimes
      run: xcrun simctl list devices available
    # Boot the simulator before xcodebuild does. On this image the tvOS 27
    # simulator can take longer than xcodebuild's 120s boot timeout.
    - name: Boot the simulator
      if: matrix.device != ''
      timeout-minutes: 10
      env:
        RUNTIME: com.apple.CoreSimulator.SimRuntime.${{ matrix.runtime }}
        DEVICE: ${{ matrix.device }}
      run: |
        udid=$(xcrun simctl list -j devices available \
          | jq -r --arg rt "$RUNTIME" --arg name "$DEVICE" \
            '.devices[$rt] // [] | map(select(.name == $name)) | .[0].udid // empty')
        if [ -z "$udid" ]; then
          echo "::error::No available '$DEVICE' simulator for $RUNTIME"
          xcrun simctl list devices available
          exit 1
        fi
        xcrun simctl boot "$udid" || true
        xcrun simctl bootstatus "$udid" -b
        echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
    # One retry: the preview image's simulators still drop the test runner
    # now and then.
    - name: Run unit test targets
      env:
        SCHEME: ${{ matrix.scheme }}
        SDK: ${{ matrix.sdk }}
      run: |
        if [ -n "$SIM_UDID" ]; then
          destination="id=$SIM_UDID"
        else
          destination="platform=macOS"
        fi
        run_tests() {
          xcodebuild test \
            -project AppAuth.xcodeproj \
            -scheme "$SCHEME" \
            -sdk "$SDK" \
            -destination "$destination"
        }
        run_tests || {
          echo "::warning::$SCHEME failed on the first try; retrying once"
          run_tests
        }
